<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>内容归档</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f0f5f0; color: #263238; line-height: 1.6;
  }
  .wrap { max-width: 600px; margin: 0 auto; background: #f6faf6; min-height: 100vh; }
  .masthead {
    background: linear-gradient(150deg, #174d1c 0%, #2e7d32 78%, #3c8f41 100%);
    color: #fff; padding: 26px 22px 22px; border-radius: 0 0 22px 22px;
  }
  .masthead .h1 { font-size: 25px; font-weight: 800; letter-spacing: 0.5px; }
  .masthead .date { font-size: 14.5px; font-weight: 600; color: #d7ecda; margin-top: 3px; }
  .inner { padding: 18px 16px 26px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 5px rgba(27,94,32,.06); padding: 18px; margin-bottom: 14px; }
  .sec-tag { font-size: 14px; font-weight: 800; color: #1b5e20; margin-bottom: 6px; letter-spacing: 0.3px; }
  a.item { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid #eef3ee; text-decoration: none; color: inherit; }
  a.item:last-child { border-bottom: none; }
  .item .ico { font-size: 26px; flex: 0 0 34px; text-align: center; }
  .item .txt { flex: 1; min-width: 0; }
  .item .wk { font-size: 17px; font-weight: 700; color: #263238; }
  .item .sub { font-size: 13px; color: #90a4ae; margin-top: 2px; }
  .item .go { font-size: 14px; font-weight: 800; color: #2e7d32; white-space: nowrap; }
  .foot { font-size: 12px; color: #a5b6a6; text-align: center; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="h1">🗂 内容归档</div>
    <div class="date">chalersxu.github.io/display</div>
  </div>
  <div class="inner">
    <div class="card">
      <div class="sec-tag">📚 栏目</div>
      <a class="item" href="./travel/">
        <span class="ico">🧳</span>
        <span class="txt">
          <span class="wk">家庭旅行攻略</span>
          <span class="sub">昆明 · 抚仙湖 · 建水 2026 国庆亲子手册</span>
        </span>
        <span class="go">进入 →</span>
      </a>
      <a class="item" href="./fhi/">
        <span class="ico">🏥</span>
        <span class="txt">
          <span class="wk">家庭健康周报</span>
          <span class="sub">每周传染病风险与家庭应对建议</span>
        </span>
        <span class="go">进入 →</span>
      </a>
    </div>
    <div class="foot">此页为资料归档用途，未列入搜索引擎索引。</div>
  </div>
</div>
</body>
</html>
