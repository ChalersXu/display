<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>家庭健康周报 · 归档</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f0f5f0; color: #263238; line-height: 1.6;
  }
  .wrap { max-width: 600px; margin: 0 auto; background: #f6faf6; min-height: 100vh; }
  .masthead {
    background: linear-gradient(150deg, #174d1c 0%, #2e7d32 78%, #3c8f41 100%);
    color: #fff; padding: 24px 22px 20px; border-radius: 0 0 22px 22px;
  }
  .masthead .h1 { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
  .masthead .date { font-size: 15px; font-weight: 600; color: #d7ecda; margin-top: 3px; }
  .inner { padding: 18px 16px 26px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 5px rgba(27,94,32,.06); padding: 18px; margin-bottom: 14px; }
  .sec-tag { font-size: 14px; font-weight: 800; color: #1b5e20; margin-bottom: 10px; letter-spacing: 0.3px; }
  a.item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #eef3ee; text-decoration: none; color: inherit; }
  a.item:last-child { border-bottom: none; }
  .item .wk { font-size: 16px; font-weight: 700; color: #263238; flex: 1; }
  .item .sub { font-size: 13px; color: #90a4ae; }
  .item .go { font-size: 14px; font-weight: 800; color: #2e7d32; }
  .foot { font-size: 12px; color: #a5b6a6; text-align: center; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="h1">🏥 家庭健康周报</div>
    <div class="date">归档</div>
  </div>
  <div class="inner">
    <div class="card">
      <div class="sec-tag">📚 全部期次</div>
      <a class="item" href="./2026-09-26/">
        <span>
          <span class="wk">9月20日 — 9月26日</span><br>
          <span class="sub">健康指数 77 · 新冠降为低流行，流感进入秋季上升期</span>
        </span>
        <span class="go">查看 →</span>
      </a>
    </div>
    <div class="foot">数据来源:国家疾控中心 · 国家流感中心 · 地方疾控 · 高德天气</div>
  </div>
</div>
</body>
</html>
